name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allow manual re-run from the Actions tab without a new commit

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /home/hari/pashupatinathnorway
            git pull origin main
            npm install
            echo "--- disk/memory before build ---"
            df -h /
            free -h
            npm run build
            pm2 restart pashupati
            echo "✅ Deploy finished, restarted pashupati"
