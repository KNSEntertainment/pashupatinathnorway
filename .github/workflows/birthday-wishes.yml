name: Send Daily Birthday Wishes

on:
  schedule:
    - cron: "0 8 * * *" # 8:00 AM UTC every day
  workflow_dispatch: # Allow manual triggering for testing

env:
  TZ: Europe/Oslo

jobs:
  send-birthday-wishes:
    runs-on: ubuntu-latest

    steps:
      - name: Send birthday wishes
        run: |
          TARGET_URL="${{ secrets.PRODUCTION_URL }}"
          if [ -z "$TARGET_URL" ]; then
            TARGET_URL="https://nepalihindu.no"
          fi

          echo "Target URL: $TARGET_URL/api/email/send-daily-birthday-wishes"
          HTTP_CODE=000
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "$TARGET_URL/api/email/send-daily-birthday-wishes")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"

          # Check if the request was successful
          if echo "$BODY" | grep -q '"success":true'; then
            echo "✅ Birthday wishes processed successfully"
          elif [ "$HTTP_CODE" = "000" ]; then
            echo "❌ Could not reach server."
            exit 1
          else
            echo "❌ Request failed with HTTP $HTTP_CODE"
            exit 1
          fi

      - name: Log results
        if: always()
        run: |
          echo "Birthday wish process completed at $(date)"
